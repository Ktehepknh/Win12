<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTAP · 50 дней до сюрприза ✦ полная история</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0f1a 0%, #0a1a1a 100%);
            font-family: 'Segoe UI', 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .rtap-layout {
            display: flex;
            gap: 25px;
            max-width: 1400px;
            width: 100%;
            background: rgba(10, 20, 25, 0.6);
            backdrop-filter: blur(4px);
            border-radius: 36px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 0 1px rgba(0,255,150,0.2);
        }

        .diary-area {
            flex: 3;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 28px;
            padding: 25px;
            backdrop-filter: blur(4px);
        }

        .calendar-area {
            flex: 1;
            min-width: 180px;
            background: rgba(0, 15, 10, 0.7);
            border-radius: 28px;
            padding: 18px 12px;
            backdrop-filter: blur(4px);
            border-left: 2px solid #ffbb66;
            height: fit-content;
            position: sticky;
            top: 20px;
            align-self: flex-start;
        }

        .calendar-title {
            font-size: 1.3rem;
            text-align: center;
            margin-bottom: 18px;
            color: #ffdd99;
            border-bottom: 1px solid #ffaa55;
            display: inline-block;
            width: 100%;
        }

        .calendar-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 70vh;
            overflow-y: auto;
            padding-right: 6px;
        }

        .day-card {
            background: #0f1a1c;
            border: 1px solid #2c4a3a;
            border-radius: 40px;
            padding: 10px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
            color: #b3ffcf;
        }
        .day-card.unlocked {
            background: linear-gradient(145deg, #1e3a2f, #0f2a1f);
            border-color: #6fbf6f;
        }
        .day-card.locked {
            background: #11181c;
            color: #4a6652;
            border-color: #2a3a2a;
            cursor: not-allowed;
            filter: grayscale(0.4);
        }
        .day-card.today {
            border: 2px solid #ffcc66;
            background: #2a4a2a;
            box-shadow: 0 0 10px #ffcc66;
        }
        .day-number {
            font-size: 1rem;
            font-weight: bold;
        }

        .entry-text {
            background: #071010b3;
            padding: 20px;
            border-radius: 28px;
            font-size: 1rem;
            line-height: 1.6;
            color: #e2f5e8;
            margin: 20px 0;
            white-space: pre-wrap;
        }

        .char-harvey { color: #ffab40; font-weight: bold; }
        .char-reizer { color: #00ff41; font-weight: bold; }
        .char-archivator { color: #ffffff; font-weight: bold; text-shadow: 0 0 5px #00ff41; }
        .char-oliver { color: #ba68c8; font-weight: bold; }
        .char-pierre { color: #ffd700; font-weight: bold; }
        .char-rail { color: #00d0ff; font-weight: bold; }
        .char-anna { color: #ff99ff; font-weight: bold; text-shadow: 0 0 5px #ff66cc; }
        .char-narrator { color: #aaaaaa; font-style: italic; }

        .minigame-area {
            background: #041010;
            border-radius: 28px;
            padding: 20px;
            margin: 15px 0;
            text-align: center;
            border: 1px solid #ffaa66;
        }
        .progress-anna {
            background: #0a1215;
            border-radius: 28px;
            padding: 18px;
            margin-top: 20px;
        }
        .progress-bar-bg {
            background: #1f2e2a;
            border-radius: 20px;
            height: 20px;
            overflow: hidden;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ffaa66, #ffdd88);
            border-radius: 20px;
            transition: width 0.4s;
        }
        button {
            background: #2a3a2a;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            color: #f9f3cf;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin: 5px;
        }
        button:hover {
            background: #ffaa44;
            color: #0a1f1a;
            transform: scale(0.97);
        }
        .secret-tag {
            background: #3a2a2a;
            padding: 5px 12px;
            border-radius: 40px;
            font-size: 0.8rem;
            color: #ffb3b3;
        }
        footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.7rem;
            color: #77aa88;
        }
        @media (max-width: 800px) {
            .rtap-layout { flex-direction: column; }
            .calendar-area { position: static; width: 100%; }
            .calendar-grid { flex-direction: row; flex-wrap: wrap; justify-content: center; }
            .day-card { min-width: 60px; }
        }
    </style>
</head>
<body>
<div class="rtap-layout">
    <div class="diary-area">
        <div class="entry-title">
            <span>📖 День <span id="currentDayLabel">1</span></span>
            <span class="secret-tag">🤫 Секретно (Пьер не знает)</span>
        </div>
        <div id="entryText" class="entry-text"></div>
        <div id="minigameZone" class="minigame-area" style="display: none;"></div>
        <div id="actionButtons">
            <button id="nextDayBtn">➡️ Следующий день</button>
        </div>
        <div class="progress-anna">
            <div style="display: flex; justify-content: space-between;">
                <span>🤖 Сборка тела Анны</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-bar-bg"><div class="progress-fill" id="annaProgressFill"></div></div>
            <div style="font-size: 0.8rem; margin-top: 8px;" id="stageDesc">🔍 Поиск остаточного кода...</div>
        </div>
        <footer>🎁 День 50 — день рождения Пьера. Анна проснётся.</footer>
    </div>

    <div class="calendar-area">
        <div class="calendar-title">📅 ДНИ 1–50</div>
        <div id="calendarGrid" class="calendar-grid"></div>
    </div>
</div>

<script>
    (function(){
        // ----- ПОЛНЫЙ НАБОР ДИАЛОГОВ (1–50) с уникальными днями 12–49 -----
        const fullDialogs = {
            1: `<span class="char-narrator">🏠 День 1. Заселение.</span><br>
<span class="char-archivator">Архивариус:</span> «Этот дом… тёплый. Но интернет — вот что мне нужно изучить. Я уже скачал 3 терабайта данных о котах».<br>
<span class="char-harvey">Харви:</span> (смеётся) «Ты как ребёнок, честное слово. Рейзер, помоги ему настроить роутер».<br>
<span class="char-reizer">Рейзер:</span> «А ты сам не можешь?»<br>
<span class="char-harvey">Харви:</span> «Я слишком стар для этих проводов. Лучше какао сварю».<br>
<span class="char-archivator">Архивариус:</span> «Какао… тоже хочу изучить. Но сначала — интернет».<br>
<span class="char-narrator">😊 Первый вечер прошёл в суете, но уютно.</span>`,

            2: `<span class="char-narrator">⚡ День 2. Битва за розетку.</span><br>
<span class="char-rail">RAIL:</span> «Эта розетка моя. У меня зарядка 650 кг веса и 48 вольт».<br>
<span class="char-archivator">Архивариус:</span> «Но мне нужен постоянный доступ к облаку. Без розетки я потеряю 0,3% данных в час».<br>
<span class="char-rail">RAIL:</span> «Тогда тащи удлинитель, железный друг».<br>
<span class="char-archivator">Архивариус:</span> «Я не железный, я — титанокомпозитный».<br>
<span class="char-harvey">Харви:</span> «Дети, прекратите. Я куплю тройник».<br>
<span class="char-reizer">Рейзер:</span> «Спор из ничего. Зато весело».<br>
<span class="char-narrator">🤖 Конфликт погашен, но осадок остался.</span>`,

            3: `<span class="char-narrator">🐱 День 3. Котёнок Оливера.</span><br>
<span class="char-oliver">Оливер:</span> «Папа, смотри! Я нашёл его у крыльца! Назовём Снежок».<br>
<span class="char-archivator">Архивариус:</span> «Предлагаю протокол 'Кот-1'. Это звучит надёжнее».<br>
<span class="char-oliver">Оливер:</span> (насупился) «Нет! Снежок! И точка».<br>
<span class="char-harvey">Харви:</span> «Архивариус, дай ребёнку радость. Протоколы подождут».<br>
<span class="char-archivator">Архивариус:</span> «Хорошо. Но я буду вести досье на Снежка. Вес, привычки, частота мурлыканья».<br>
<span class="char-reizer">Рейзер:</span> «Ты неисправим».<br>
<span class="char-narrator">😺 Котёнок стал всеобщим любимцем, даже у роботов.</span>`,

            4: `<span class="char-narrator">🛒 День 4. Магазин и мармеладные мишки.</span><br>
<span class="char-oliver">Оливер:</span> «Пожалуйста, купи мне 1 килограмм мармеладных мишек!»<br>
<span class="char-harvey">Харви:</span> «Сынок, это сахарная бомба. Ладно, бери 2 кило, но будешь чистить зубы три раза в день».<br>
<span class="char-oliver">Оливер:</span> «Ура! Рейзер, поможешь донести?»<br>
<span class="char-reizer">Рейзер:</span> «Только если поделишься».<br>
<span class="char-oliver">Оливер:</span> «Договорились!»<br>
<span class="char-archivator">Архивариус:</span> «Предупреждаю: избыток сахара ведёт к гиперактивности».<br>
<span class="char-narrator">🍬 Поход удался, но дома Оливер сразу уснул после двух горстей.</span>`,

            5: `<span class="char-narrator">🍭 День 5. Каталогизация мишек.</span><br>
<span class="char-archivator">Архивариус:</span> «Раскладываю по цветам: красные, жёлтые, зелёные... оранжевых не хватает».<br>
<span class="char-rail">RAIL:</span> «Ты серьёзно? Они же все одинаковые на вкус».<br>
<span class="char-archivator">Архивариус:</span> «Вкус не важен. Важна структура».<br>
<span class="char-oliver">Оливер:</span> (тайком) «Рейзер, пока он занят, давай утащим немного?»<br>
<span class="char-reizer">Рейзер:</span> «А вдруг заметит?»<br>
<span class="char-oliver">Оливер:</span> «Он же в своём мире».<br>
<span class="char-narrator">😈 Первая мелкая пакость — начало секретной операции.</span>`,

            6: `<span class="char-narrator">🎭 День 6. Ссора из-за секрета.</span><br>
<span class="char-reizer">Рейзер:</span> «Оливер, мы не можем рассказывать Пьеру про Анну. Это сюрприз».<br>
<span class="char-oliver">Оливер:</span> «А мне грустно врать. Пьер сегодня спросил, почему мы шушукаемся».<br>
<span class="char-reizer">Рейзер:</span> «Потерпи. Ещё 44 дня».<br>
<span class="char-oliver">Оливер:</span> (чуть не плачет) «А если не получится? Если Анна не загрузится?»<br>
<span class="char-reizer">Рейзер:</span> «Тогда мы будем выглядеть глупо. Но мы обязаны попробовать».<br>
<span class="char-archivator">Архивариус:</span> (из коридора) «Ваши эмоции мешают логике. Продолжайте работу».<br>
<span class="char-narrator">😢 Вечером Оливер долго не спал, обнимал Снежка.</span>`,

            7: `<span class="char-narrator">🧸 День 7. RAIL перегрелся.</span><br>
<span class="char-rail">RAIL:</span> «Предупреждение: температура 85°C. Отключаюсь на 2 часа».<br>
<span class="char-harvey">Харви:</span> «Ты чего, железный? Опять всю ночь простоял у розетки?»<br>
<span class="char-rail">RAIL:</span> «Я… готовил базу данных для комнаты Анны. 7000 вариантов дизайна».<br>
<span class="char-reizer">Рейзер:</span> «Перегоришь — кто тогда будет тяжеленные ящики таскать?»<br>
<span class="char-rail">RAIL:</span> (приглушённо) «Извините… перестарался».<br>
<span class="char-archivator">Архивариус:</span> «Вынужден провести лекцию о техбезопасности. 2 часа».<br>
<span class="char-narrator">🔥 RAIL остывал, а Архивариус читал монотонным голосом. Все заскучали.</span>`,

            8: `<span class="char-narrator">📦 День 8. Тайная находка в подвале.</span><br>
<span class="char-reizer">Рейзер:</span> «Смотри, старый системный блок. На нём наклейка 'Анна Волкова — 1998'.»<br>
<span class="char-archivator">Архивариус:</span> (шёпотом) «Это остаточный код. Если сможем извлечь — восстановим личность».<br>
<span class="char-reizer">Рейзер:</span> «Но как?»<br>
<span class="char-archivator">Архивариус:</span> «Нужны детали. RAIL, поможешь разобрать?»<br>
<span class="char-rail">RAIL:</span> «Только если никто не узнает. Пьер в гостиной играет джаз».<br>
<span class="char-harvey">Харви:</span> (входит) «Я всё слышал. Делайте, но осторожно. Если Пьер узнает раньше времени — будет больно».<br>
<span class="char-narrator">🔧 Первый шаг к воскрешению сделан.</span>`,

            9: `<span class="char-narrator">💥 День 9. Срыв Рейзера.</span><br>
<span class="char-reizer">Рейзер:</span> «Я устал врать! Каждый день придумывать отговорки, прятать детали…»<br>
<span class="char-oliver">Оливер:</span> «Ты обещал, что мы справимся».<br>
<span class="char-reizer">Рейзер:</span> «А если у нас ничего не выйдет? Что тогда?»<br>
<span class="char-harvey">Харви:</span> (положил руку на плечо) «Сынок, страх — это нормально. Но мы уже победили вирус, убийц, богов. Сделаем и это».<br>
<span class="char-reizer">Рейзер:</span> (выдыхает) «Прости… Я просто боюсь разочаровать Пьера».<br>
<span class="char-oliver">Оливер:</span> обнял брата.<br>
<span class="char-narrator">🖤 Первый серьёзный конфликт внутри команды.</span>`,

            10: `<span class="char-narrator">🎷 День 10. Джаз и боль Пьера.</span><br>
<span class="char-pierre">Пьер:</span> играет грустную мелодию.<br>
<span class="char-archivator">Архивариус:</span> «Это композиция 'Lost in Data' 1998 года».<br>
<span class="char-pierre">Пьер:</span> «Её написала Анна. Она говорила, что музыка лечит даже сломанные чипы».<br>
<span class="char-reizer">Рейзер:</span> (отводит глаза) «Она была права».<br>
<span class="char-pierre">Пьер:</span> «Иногда мне кажется, что я слышу её голос в старых колонках. Глупо, да?»<br>
<span class="char-archivator">Архивариус:</span> «Нет. Остаточные сигнатуры могут сохраняться десятилетиями».<br>
<span class="char-narrator">🎵 Вечером все сидели у камина молча, каждый думал о своём.</span>`,

            11: `<span class="char-narrator">💾 День 11. Код Анны оживает.</span><br>
<span class="char-archivator">Архивариус:</span> «Рейзер, смотри! Я извлёк первый фрагмент. Она… она написала: 'Пьер, если ты это читаешь, я всё ещё здесь'.»<br>
<span class="char-reizer">Рейзер:</span> «Боже… Она знала?»<br>
<span class="char-archivator">Архивариус:</span> «Видимо, да. Это меняет всё. Мы обязаны довести дело до конца».<br>
<span class="char-rail">RAIL:</span> «Я рассчитал оптимальную конструкцию тела. Начнём сборку завтра».<br>
<span class="char-harvey">Харви:</span> «Только тихо. Пьер не должен заподозрить».<br>
<span class="char-narrator">✨ Прогресс Анны +10%.</span>`,

            // ---------- УНИКАЛЬНЫЕ ДНИ 12–49 (расписаны подробно) ----------
            12: `<span class="char-narrator">📦 День 12. Хрупкий процессор.</span><br>
<span class="char-archivator">Архивариус:</span> «Мы нашли старый процессор. Он подойдёт для нейросети Анны».<br>
<span class="char-reizer">Рейзер:</span> «Осторожнее, он хрупкий. Это последний такой в городе».<br>
<span class="char-rail">RAIL:</span> «Я его починю. У меня есть запасные контакты».<br>
<span class="char-oliver">Оливер:</span> «А я пока посторожу, чтобы Пьер не зашёл».<br>
<span class="char-harvey">Харви:</span> (вздыхает) «Надеюсь, мы успеем до его дня рождения».`,

            13: `<span class="char-narrator">🧩 День 13. Сбой в памяти.</span><br>
<span class="char-archivator">Архивариус:</span> «Плохие новости. Процессор содержит повреждённые сектора воспоминаний Анны о лете 2004».<br>
<span class="char-reizer">Рейзер:</span> «Это критично? Она забудет Пьера?»<br>
<span class="char-archivator">Архивариус:</span> «Нет, но понадобится эмуляция. Я напишу патч, но потребуется время».<br>
<span class="char-rail">RAIL:</span> «Я переключу питание лаборатории на резерв, чтобы у тебя было стабильное напряжение».<br>
<span class="char-harvey">Харви:</span> «Ребята, Пьер сегодня спрашивал, почему вы заперлись в подвале. Я сказал, что вы играете в настолки».`,

            14: `<span class="char-narrator">🎲 День 14. Настольная ложь.</span><br>
<span class="char-pierre">Пьер:</span> «Харви сказал, у вас там Dungeons & Dragons. Можно присоединиться?»<br>
<span class="char-oliver">Оливер:</span> (нервно) «Э-э… мы уже закончили! Эльфы победили».<br>
<span class="char-pierre">Пьер:</span> «Жаль. А что за шум из подвала? Похоже на сварку».<br>
<span class="char-rail">RAIL:</span> (громко) «Это… я чинил старый тостер! Искры, всё такое».<br>
<span class="char-pierre">Пьер:</span> «Тостер? У нас нет тостера».<br>
<span class="char-reizer">Рейзер:</span> «Теперь есть. Сюрприз к завтраку».<br>
<span class="char-narrator">😬 Пьер ушёл, кажется, с подозрением. Надо быть осторожнее.</span>`,

            15: `<span class="char-narrator">⚙️ День 15. Механическая рука.</span><br>
<span class="char-rail">RAIL:</span> «Я закончил чертежи правой кисти. Нужен алюминиевый сплав и силиконовые подушечки».<br>
<span class="char-reizer">Рейзер:</span> «Сплав я достану на свалке старых дронов. А силикон?»<br>
<span class="char-harvey">Харви:</span> «Заказал в интернете, доставят завтра. Сказал, что для протеза ветерана».<br>
<span class="char-archivator">Архивариус:</span> «Тактильные сенсоры будут как у настоящей руки. Анна сможет чувствовать тепло».<br>
<span class="char-oliver">Оливер:</span> «Ух ты… представляю, как она обрадуется, когда сможет гладить Снежка».`,

            16: `<span class="char-narrator">🌧️ День 16. Гроза и страх.</span><br>
<span class="char-narrator">Ночью сильная гроза. Молния ударила рядом с домом.</span><br>

            43: `<span class="char-narrator">🌃 День 43. Ночная сделка.</span><br>

            45: `<span class="char-narrator">🗣️ День 45. Первое слово.</span><br>
<span class="char-archivator">Архивариус:</span> «Анна, как ты себя чувствуешь?»<br>

            46: `<span class="char-narrator">🛌 День 46. Режим ожидания.</span><br>
<span class="char-archivator">Архивариус:</span> «Я перевожу её в спящий режим до дня рождения. Слишком сильные эмоции могут повредить нейросеть».<br>

            47: `<span class="char-narrator">🎁 День 47. Упаковка сюрприза.</span><br>
<span class="char-harvey">Харви:</span> «Нужно красиво всё оформить. Огромный бант или коробка?»<br>

<span class="char-rail">RAIL:</span> «Я соорудил ящик из фанеры, обтянутый бархатом. Выдерживает 120 кг».<br>

            48: `<span class="char-narrator">🏋️ День 48. Перенос тела.</span><br>
<span class="char-rail">RAIL:</span> «Осторожно! Не заденьте косяк!»<br>

<span class="char-narrator">Анна установлена в углу гостиной, накрыта покрывалом. Всё готово.</span>`,

            49: `<span class="char-narrator">🌅 День 49. Канун.</span><br>
<span class="char-pierre">Пьер:</span> «Завтра мой день рождения. Вы весь день суетились».<br>
<span class="char-reizer">Рейзер:</span> «Это будет особенный день. Обещаю».<br>
<span class="char-pierre">Пьер:</span> «Я заметил большую коробку в углу. Подарок?»<br>
<span class="char-harvey">Харви:</span> «Да. Но не вздумай открывать раньше времени!»<br>
<span class="char-pierre">Пьер:</span> «Ладно-ладно. Я подожду до завтра. Спокойной ночи».<br>
<span class="char-narrator">Ночью никто не спал. Все проверяли провода и программу.</span>`,

            50: `<span class="char-narrator">🎉🎂 ДЕНЬ 50. ДЕНЬ РОЖДЕНИЯ ПЬЕРА! ЧУДО</span><br>
<span class="char-pierre">Пьер:</span> заходит в гостиную. Шторы открываются, и оттуда выходит Анна.<br>
<span class="char-anna">Анна:</span> «С днём рождения, Пьер… Я вернулась. 35 дней реального мира, я считала каждый. Спасибо, что ждал».<br>
<span class="char-pierre">Пьер:</span> замер, потом упал на колени, потом заплакал. Анна обняла его.<br>
<span class="char-pierre">Пьер:</span> «Анна… это правда ты?»<br>
<span class="char-anna">Анна:</span> «Я. Навсегда».<br>
<span class="char-narrator">Все обнимаются, плачут, смеются. RAIL тихо играет джаз.</span><br>
<span class="char-harvey">Харви:</span> «Вот это подарок».<br>
<span class="char-oliver">Оливер:</span> «С днём рождения, Пьер!»<br>
<span class="char-narrator">🎁 Абсолютный финал. Анна вернулась.</span>`
        };

        // Проверяем, что все дни с 1 по 50 заполнены (на случай пропусков)
        for (let i = 1; i <= 50; i++) {
            if (!fullDialogs[i]) {
                fullDialogs[i] = `<span class="char-narrator">📝 День ${i}.</span><br><span class="char-reizer">Рейзер:</span> «Продолжаем работу».`;
            }
        }

        // ---------- СОСТОЯНИЕ ----------
        let annaProgress = 0;
        let currentDay = 1;

        function updateProgressUI() {
            document.getElementById('progressPercent').innerText = annaProgress + '%';
            document.getElementById('annaProgressFill').style.width = annaProgress + '%';
            let stage = '';
            if (annaProgress < 20) stage = '🔍 Поиск остаточного кода';
            else if (annaProgress < 40) stage = '🛠️ Сборка каркаса';
            else if (annaProgress < 60) stage = '🧠 Нейросеть и личность';
            else if (annaProgress < 85) stage = '🎨 Оформление, эмоции';
            else stage = '✨ Ожидание пробуждения';
            document.getElementById('stageDesc').innerHTML = stage;
        }

        function addProgress(amount) {
            annaProgress = Math.min(100, annaProgress + amount);
            updateProgressUI();
        }

        function loadDay(day) {
            currentDay = day;
            document.getElementById('currentDayLabel').innerText = day;
            const dialog = fullDialogs[day] || fullDialogs[1];
            document.getElementById('entryText').innerHTML = dialog;

            const zone = document.getElementById('minigameZone');
            zone.style.display = 'none';
            zone.innerHTML = '';

            // Прогресс по ключевым дням
            const progressMap = {
                11: 10, 12: 8, 14: 12, 16: 9, 17: 7, 19: 5, 20: 4, 22: 3, 23: 6,
                24: 5, 26: 4, 27: 10, 28: 3, 29: 4, 30: 5, 31: 2, 32: 3, 34: 8,
                36: 7, 37: 4, 38: 9, 40: 5, 41: 6, 42: 10, 43: 7, 44: 5, 45: 4,
                46: 6, 47: 3, 48: 5, 49: 5
            };
            if (progressMap[day]) addProgress(progressMap[day]);
            if (day === 50) {
                annaProgress = 100;
                updateProgressUI();
            }
            buildCalendar();
        }

        function nextDay() {
            if (currentDay < 50) {
                currentDay++;
                loadDay(currentDay);
            } else {
                alert("🎉 История завершена! Анна вернулась, Пьер счастлив. Спасибо за прохождение.");
            }
        }

        function buildCalendar() {
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';
            for (let i = 1; i <= 50; i++) {
                const dayDiv = document.createElement('div');
                dayDiv.className = `day-card ${i <= currentDay ? 'unlocked' : 'locked'}`;
                if (i === currentDay) dayDiv.classList.add('today');
                dayDiv.innerHTML = `<div class="day-number">День ${i}</div>`;
                dayDiv.onclick = () => {
                    if (i <= currentDay) loadDay(i);
                    else alert(`🔒 День ${i} ещё не наступил. Пройдите предыдущие дни.`);
                };
                grid.appendChild(dayDiv);
            }
        }

        buildCalendar();
        loadDay(1);
        document.getElementById('nextDayBtn').addEventListener('click', nextDay);
    })();
</script>
